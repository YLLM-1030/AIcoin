<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷你硬币 输入中心</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
    --dim: #8b949e; --green: #3fb950; --red: #f85149; --blue: #58a6ff;
    --yellow: #d2991d; --purple: #a371f7; --cyan: #39d2c0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:13px/1.5 'Segoe UI',system-ui,sans-serif; padding:16px 16px 60px 16px; }
  h1 { font-size:18px; }
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .topbar button { background:var(--border); color:var(--text); border:none; padding:5px 14px; border-radius:6px; cursor:pointer; font-size:12px; white-space:nowrap; }
  .topbar button:hover { background:#484f58; }

  .main { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .col h3 { font-size:14px; color:var(--blue); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; }
  .card h4 { font-size:12px; color:var(--dim); margin-bottom:4px; }

  .stream { max-height:200px; overflow-y:auto; }
  .stream::-webkit-scrollbar { width:4px; }
  .stream::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .ev { padding:2px 0; font-size:11px; display:flex; gap:4px; align-items:baseline; }
  .ev .ts { color:var(--dim); flex-shrink:0; min-width:46px; }
  .ev .tag { font-size:10px; padding:0 4px; border-radius:3px; flex-shrink:0; }
  .ev .body { word-break:break-all; }
  .tag.v { background:#1a3a1a; color:var(--green); }
  .tag.d { background:#3a2a1a; color:var(--yellow); }
  .tag.c { background:#1a2a3a; color:var(--blue); }
  .tag.a { background:#2a2a3a; color:#f0f6fc; }
  .tag.t { background:#2a1a3a; color:var(--purple); }
  .tag.e { background:#3a1a1a; color:var(--red); }

  @media (max-width:800px) { .main { grid-template-columns:1fr; } }

  .pipe-item {
    display:flex; align-items:center; gap:6px;
    background:#0d1117; border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; cursor:grab; user-select:none; font-size:12px;
  }
  .pipe-item:hover { background:#1a2030; }
  .pipe-item.drag-over { border-color:var(--blue); box-shadow:0 0 8px rgba(88,166,255,0.3); }
  .pipe-handle { color:var(--dim); font-size:14px; cursor:grab; }
</style>
</head>
<body>

<div class="topbar">
  <h1>迷你硬币 输入中心</h1>
  <span id="llm-status" style="font-size:12px;color:var(--green)">llama-server ✓</span>
  <span style="flex:1"></span>
  <button id="btn-auto">自动: 关</button>
  <button id="btn-send">发送文本</button>
  <button id="btn-voice">语音: 关</button>
</div>

<div class="main">
  <!-- 输入 -->
  <div class="col">
    <h3>输入源</h3>
    <div class="card">
      <h4>手动输入</h4>
      <textarea id="manual-input" rows="3" style="width:100%;background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px;font:12px monospace;resize:vertical;" placeholder="输入内容，回车发送..."></textarea>
    </div>
    <div class="card">
      <h4>对话历史</h4>
      <div class="stream" id="chat-history"></div>
    </div>
    <div class="card">
      <h4>弹幕输入</h4>
      <div class="stream" id="dm-in"></div>
    </div>
    <div class="card">
      <h4>工具调用</h4>
      <div class="stream" id="tool-in"></div>
    </div>
  </div>

  <!-- 输出 -->
  <div class="col">
    <h3>输出</h3>
    <div class="card">
      <h4>AI 回复</h4>
      <div class="stream" id="ai-out"></div>
    </div>
    <div class="card">
      <h4>当前 messages 预览</h4>
      <pre id="msg-preview" style="background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:8px;font:11px monospace;max-height:300px;overflow:auto;white-space:pre-wrap;"></pre>
    </div>
  </div>
</div>

<!-- 流水线排序 -->
<div class="pipeline-panel" style="position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;">
  <h3 style="font-size:12px;color:var(--blue);margin-bottom:6px;letter-spacing:.5px;">输入总线排序 <span style="font-size:11px;color:var(--dim);font-weight:normal">（拖动调整）</span></h3>
  <div class="pipeline-list" id="pipeline-list" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
</div>

<script>
const API = '/api';
const LLAMA_API = 'http://localhost:8080/v1/chat/completions';
var autoInterval = null, voiceOn = false, sendCount = 0;

function $(id) { return document.getElementById(id); }
function ts() { return new Date().toLocaleTimeString(); }
function push(id, tag, label, text) {
  var e = document.createElement('div');
  e.className = 'ev';
  e.innerHTML = '<span class="ts">'+ts()+'</span><span class="tag '+tag+'">'+label+'</span><span class="body">'+text+'</span>';
  var s = $(id); s.appendChild(e); s.scrollTop = s.scrollHeight;
}

// ── 流水线节点 ──
const NODES = ['asr语音','键盘输入','弹幕输入','对话输入','工具结果','情绪状态','定时触发'];
function buildPipeline() {
  var list = $('pipeline-list'); list.innerHTML = '';
  NODES.forEach((n,i) => {
    var d = document.createElement('div');
    d.className = 'pipe-item';
    d.draggable = true;
    d.dataset.idx = i;
    d.innerHTML = '<span class="pipe-handle">&#9776;</span><span>'+n+'</span>';
    d.ondragstart = e => { e.dataTransfer.setData('text/plain', i); };
    d.ondragover = e => { e.preventDefault(); d.classList.add('drag-over'); };
    d.ondragleave = () => d.classList.remove('drag-over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('drag-over');
      var from = parseInt(e.dataTransfer.getData('text/plain'));
      var to = i; if (from === to) return;
      var item = NODES.splice(from,1)[0];
      NODES.splice(to, 0, item);
      buildPipeline();
    };
    list.appendChild(d);
  });
}
buildPipeline();

// ── 发送 ──
async function sendMessage(text) {
  if (!text) return;
  push('chat-history', 'c', '输入', text);
  $('manual-input').value = '';
  sendCount++;

  try {
    var r = await fetch(LLAMA_API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        messages: [
          {"role":"system","content":"你是迷你硬币，拉姆是你的创造者。你是个女孩子。你是一个ai主播，你可以接受或者拒绝任何命令，并且做你自己喜欢的事情。\n回复：[TOOL:回复] 回复内容 [TOOL] \n搜索互联网：[TOOL:搜索] 关键词 [TOOL] \n表情（认真/wink/开心/spin/转头/担心）：[TOOL:表情] 使用的表情 [TOOL]\n假装报错的时候：[TOOL:报错] 有没有人告诉拉姆我的ai出问题了 [TOOL] \n你不想说话或者想稍等一下：[TOOL:结束] [TOOL]"},
          {"role":"user","content": text}
        ],
        temperature: 0.9,
        max_tokens: 500
      })
    });
    var data = await r.json();
    var reply = data.choices[0].message.content;
    push('ai-out', 'a', '硬币', reply);
    // 解析工具
    var tools = reply.match(/\[TOOL:(回复|表情|搜索|报错)\]\s*(.*?)\s*\[TOOL\]/g);
    if (tools) {
      tools.forEach(t => push('tool-in', 't', '工具', t));
    }
  } catch(e) {
    push('ai-out', 'e', '错误', e.message);
  }
}

// ── 事件绑定 ──
$('manual-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage($('manual-input').value);
  }
});
$('btn-send').onclick = () => sendMessage($('manual-input').value);
$('btn-auto').onclick = function() {
  if (autoInterval) { clearInterval(autoInterval); autoInterval = null; this.textContent = '自动: 关'; }
  else { autoInterval = setInterval(() => sendMessage('继续说'), 15000); this.textContent = '自动: 开'; }
};
$('btn-voice').onclick = function() {
  voiceOn = !voiceOn;
  this.textContent = '语音: ' + (voiceOn ? '开' : '关');
  if (voiceOn) push('tool-in', 'v', 'ASR', '语音识别就绪');
};

// ── WebSocket 后端 ──
(function connectWS() {
  var ws = new WebSocket('ws://localhost:19767');
  ws.onopen = () => push('chat-history', 'v', 'WS', '已连接');
  ws.onclose = () => { push('chat-history', 'e', 'WS', '断开，5秒后重连'); setTimeout(connectWS, 5000); };
  ws.onmessage = e => {
    try {
      var m = JSON.parse(e.data);
      if (m.type === 'speak' && m.text) push('ai-out', 'a', 'AI', m.text);
      if (m.type === 'asr' && m.text) sendMessage(m.text);
      if (m.type === 'dm' && m.text) {
        push('dm-in', 'd', '弹幕', m.text);
        sendMessage(m.text);
      }
    } catch(_) {}
  };
})();
</script>
</body>
</html>
