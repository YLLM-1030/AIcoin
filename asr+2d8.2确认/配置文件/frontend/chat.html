<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Coin Chat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0d1117;color:#c9d1d9;font:14px/1.5 'Segoe UI',system-ui,sans-serif;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }

  /* 顶部标题栏 */
  #header{
    background:#161b22;border-bottom:1px solid #30363d;
    padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  #header .dot{width:8px;height:8px;border-radius:50%;background:#3fb950;}
  #header .dot.off{background:#f85149;}
  #header h1{font-size:15px;font-weight:600;color:#e6edf3;}
  #header .status{font-size:11px;color:#8b949e;margin-left:auto;}
  #tool-indicator{
    display:none;font-size:11px;color:#d29922;padding:2px 8px;
    border:1px solid #d29922;border-radius:4px;
    animation:pulse 1.5s infinite;margin-left:auto;margin-right:8px;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

  /* 消息列表 */
  #messages{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:12px;
  }
  #messages::-webkit-scrollbar{width:6px}
  #messages::-webkit-scrollbar-track{background:transparent}
  #messages::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

  /* 消息气泡 */
  .msg{max-width:75%;padding:10px 14px;border-radius:12px;line-height:1.5;word-break:break-word;animation:fadeIn 0.2s;}
  .msg.user{align-self:flex-end;background:#238636;color:#e6edf3;border-bottom-right-radius:4px;}
  .msg.assistant{align-self:flex-start;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-bottom-left-radius:4px;}
  .msg.assistant.streaming{border-color:#58a6ff;}
  .msg.system{align-self:center;background:transparent;color:#8b949e;font-size:12px;max-width:90%;text-align:center;}
  .msg .time{font-size:10px;color:#484f58;margin-top:4px;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  /* 输入栏 */
  #input-bar{
    background:#161b22;border-top:1px solid #30363d;
    padding:10px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0;
  }
  #input-bar input{
    flex:1;background:#0d1117;color:#c9d1d9;font:14px system-ui;
    padding:10px 14px;border-radius:8px;border:1px solid #30363d;outline:none;
    transition:border-color 0.15s;
  }
  #input-bar input:focus{border-color:#58a6ff;}
  #input-bar input::placeholder{color:#484f58;}
  #input-bar button{
    background:#238636;color:#fff;font:14px system-ui;font-weight:600;
    padding:10px 16px;border:none;border-radius:8px;cursor:pointer;
    transition:background 0.15s;white-space:nowrap;
  }
  #input-bar button:hover{background:#2ea043;}
  #input-bar button:disabled{background:#21262d;color:#484f58;cursor:default;}

  /* 状态提示 */
  #toast{
    position:fixed;top:60px;left:50%;transform:translateX(-50%);
    background:#21262d;border:1px solid #30363d;color:#8b949e;
    padding:6px 16px;border-radius:6px;font-size:12px;
    opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:100;
  }
  #toast.show{opacity:1}
</style>
</head>
<body>

<div id="header">
  <div class="dot" id="status-dot"></div>
  <h1>Mini Coin Chat</h1>
  <span id="tool-indicator">🔧 工具调用中</span>
  <span class="status" id="status-text">连接中...</span>
</div>

<div id="messages">
  <div class="msg system">Mini Coin Chat 已就绪</div>
</div>

<div id="input-bar">
  <input id="input" type="text" placeholder="输入消息..." autocomplete="off" autofocus>
  <button id="send-btn" onclick="send()">发送</button>
</div>

<div id="toast"></div>

<script>
// ── 状态 ────────────────────────────────
let wsConnected = false;
let isStreaming = false;
let lastStreamEnd = 0;   // 流式结束时间戳，3s 内跳过 WS speak
let lastSpeakText = '';  // 上一条 speak 文本
let lastSpeakTime = 0;   // 上一条 speak 时间戳
const msgContainer = document.getElementById('messages');

// ── 初始化 ──────────────────────────────
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ── WebSocket (接收 speak/emotion) ──────
function connectWS() {
  const ws = new WebSocket('ws://127.0.0.1:19767');
  ws.onopen = () => {
    wsConnected = true;
    updateStatus(true);
    console.log('[WS] connected');
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'speak') {
        // 流式回复中或回复后 3 秒内跳过（SSE 已处理）
        if (isStreaming || (Date.now() - lastStreamEnd < 3000)) return;
        // 去重: 10 秒内相同文本不重复
        const key = (msg.text||'').substring(0,60);
        if (key && key === lastSpeakText && (Date.now() - lastSpeakTime < 10000)) return;
        lastSpeakText = key;
        lastSpeakTime = Date.now();
        if (msg.text) {
          addMessage(msg.text, 'assistant');
        }
        // TTS 音频播放
        if (msg.audio_url) {
          playAudioUrl(msg.audio_url);
        } else if (msg.text) {
          speakBrowser(msg.text);
        }
      }
      if (msg.type === 'emotion') {
        console.log('[Emotion]', msg.emotion);
        toast('情绪: ' + msg.emotion);
      }
    } catch (err) {}
  };
  ws.onclose = () => {
    wsConnected = false;
    updateStatus(false);
    showWSError('WS 断开，心跳消息无法接收');
    console.log('[WS] disconnected, retry in 2s');
    setTimeout(connectWS, 2000);
  };
  ws.onerror = (e) => {
    showWSError('⚠️ WS 连接失败！检查 bridge 是否运行');
    ws.close();
  };
}
connectWS();

// ── 语音 WebSocket (独立，不依赖 Bridge) ──
(function connectVoiceWS() {
  const vws = new WebSocket('ws://127.0.0.1:19768');
  vws.onopen  = () => console.log('[Voice] connected');
  vws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'voice_input' && msg.text) {
        addMessage(msg.text, 'user');
      }
    } catch (_) {}
  };
  vws.onclose = () => {
    console.log('[Voice] disconnected, retry in 2s');
    setTimeout(connectVoiceWS, 2000);
  };
  vws.onerror = () => vws.close();
})();

// ── WS 错误横幅 ──────────────────────────
function showWSError(msg) {
  let el = document.getElementById('ws-error');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ws-error';
    el.style.cssText = 'position:fixed;top:50px;left:0;right:0;z-index:999;background:#f85149;color:#fff;padding:8px 16px;text-align:center;font:13px system-ui;font-weight:600';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
}

// ── 状态指示 ────────────────────────────
function updateStatus(connected) {
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (connected) {
    dot.className = 'dot';
    text.textContent = 'bridge 已连接';
  } else {
    dot.className = 'dot off';
    text.textContent = 'bridge 离线';
  }
}

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── 消息渲染 ────────────────────────────
function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  msgContainer.appendChild(div);
  msgContainer.scrollTop = msgContainer.scrollHeight;
  return div;  // 返回引用，供流式更新
}

// ── 工具状态指示 ────────────────────
function showTool(name) {
  const el = document.getElementById('tool-indicator');
  el.style.display = 'inline-block';
  el.textContent = '🔧 ' + name;
}
function hideTool() {
  document.getElementById('tool-indicator').style.display = 'none';
}

// ── 发送消息 ────────────────────────────
async function send() {
  const inp = document.getElementById('input');
  const btn = document.getElementById('send-btn');
  const text = inp.value.trim();
  if (!text || isStreaming) return;

  addMessage(text, 'user');
  inp.value = '';
  inp.disabled = true;
  btn.disabled = true;
  isStreaming = true;
  hideTool();

  // 创建流式气泡
  const bubble = addMessage('...', 'assistant');
  bubble.classList.add('streaming');
  let fullReply = '';

  try {
    const res = await fetch('http://127.0.0.1:8091/chat_stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    if (!res.ok) {
      bubble.textContent = '错误: HTTP ' + res.status;
      bubble.classList.remove('streaming');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'token') {
            fullReply += data.text;
            bubble.textContent = fullReply;
            msgContainer.scrollTop = msgContainer.scrollHeight;
            // 检测工具调用标识
            const m = fullReply.match(/\[TOOL:(\w+)\]/);
            if (m) showTool(m[1]);
          } else if (data.type === 'emotion') {
            toast('情绪: ' + data.emotion);
          } else if (data.type === 'tool_start') {
            showTool(data.name);
          } else if (data.type === 'tool_end') {
            hideTool();
          } else if (data.type === 'done') {
            fullReply = data.reply || fullReply;
            bubble.textContent = fullReply;
            hideTool();
          } else if (data.type === 'error') {
            bubble.textContent = '错误: ' + data.message;
          }
        } catch (e) { /* skip malformed */ }
      }
    }
  } catch (e) {
    bubble.textContent = '连接失败: ' + e.message;
  } finally {
    bubble.classList.remove('streaming');
    if (!fullReply) bubble.textContent = '(无回复)';
    inp.disabled = false;
    btn.disabled = false;
    isStreaming = false;
    lastStreamEnd = Date.now();
    inp.focus();
  }
}

// ── TTS: edge-tts URL 播放 ──────────────
let currentAudio = null;  // 当前正在播放的 audio 或 speech

function stopCurrentTTS() {
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (_) {}
    currentAudio = null;
  }
  if ('speechSynthesis' in window) {
    try { speechSynthesis.cancel(); } catch (_) {}
  }
}

function playAudioUrl(url) {
  stopCurrentTTS();
  const a = new Audio(url);
  a.volume = 0.9;
  a.onended = () => { currentAudio = null; };
  a.onerror = () => { console.warn('[TTS] audio failed:', url); currentAudio = null; };
  currentAudio = a;
  a.play().catch(e => { console.warn('[TTS] play failed:', e); currentAudio = null; });
}

// ── TTS: 浏览器回退 ─────────────────────
function speakBrowser(text) {
  if (!('speechSynthesis' in window)) return;
  stopCurrentTTS();
  const u = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang.includes('zh')) || voices[0];
  if (zh) u.voice = zh;
  u.rate = 1.0;
  speechSynthesis.speak(u);
}

// ── 聚焦输入框 ──────────────────────────
document.getElementById('input').focus();
</script>
</body>
</html>
