<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini_coin 输入中心</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
    --dim: #8b949e; --green: #3fb950; --red: #f85149; --blue: #58a6ff;
    --yellow: #d2991d; --purple: #a371f7; --cyan: #39d2c0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:13px/1.5 'Segoe UI',system-ui,sans-serif; padding:16px 16px 60px 16px; }
  h1 { font-size:18px; }
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .topbar button { background:var(--border); color:var(--text); border:none; padding:5px 14px; border-radius:6px; cursor:pointer; font-size:12px; white-space:nowrap; }
  .topbar button:hover { background:#484f58; }
  .ws-dot { display:inline-block; width:8px; height:8px; border-radius:50%; }
  .ws-dot.online { background:var(--green); } .ws-dot.offline { background:var(--red); }

  .main { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .col h3 { font-size:14px; color:var(--blue); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; }
  .card h4 { font-size:12px; color:var(--dim); margin-bottom:4px; }

  .stream { max-height:130px; overflow-y:auto; }

  /* 流水线固定在底部 */
  .stream::-webkit-scrollbar { width:4px; }
  .stream::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .ev { padding:2px 0; font-size:11px; display:flex; gap:4px; align-items:baseline; }
  .ev .ts { color:var(--dim); flex-shrink:0; min-width:46px; }
  .ev .tag { font-size:10px; padding:0 4px; border-radius:3px; flex-shrink:0; }
  .ev .body { word-break:break-all; }
  .tag.v { background:#1a3a1a; color:var(--green); }
  .tag.d { background:#3a2a1a; color:var(--yellow); }
  .tag.c { background:#1a2a3a; color:var(--blue); }
  .tag.a { background:#2a2a3a; color:#f0f6fc; }
  .tag.t { background:#2a1a3a; color:var(--purple); }
  .tag.e { background:#3a1a1a; color:var(--red); }

  .info { display:flex; gap:24px; font-size:11px; color:var(--dim); margin-bottom:8px; flex-wrap:wrap; }

  @media (max-width:800px) { .main { grid-template-columns:1fr; } }

  /* 流水线拖拽 */
  .pipe-item {
    display:flex; align-items:center; gap:6px;
    background:#0d1117; border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; cursor:grab; user-select:none; font-size:12px;
    transition: background 0.2s;
  }
  .pipe-item:hover { background:#1a2030; }
  .pipe-item.dragging { opacity:0.4; background:var(--blue); }
  .pipe-item.drag-over { border-color:var(--blue); box-shadow:0 0 8px rgba(88,166,255,0.3); }
  .pipe-handle { color:var(--dim); font-size:14px; cursor:grab; }
  .pipe-label { color:var(--text); }
  .pipe-idx { color:var(--dim); font-size:10px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>mini_coin 输入中心</h1>
  <span class="ws-dot offline" id="ws-dot"></span>
  <span style="color:var(--dim);font-size:12px" id="ws-status">连接中...</span>
  <span style="flex:1"></span>
  <button id="btn-auto">自动: 关</button>
  <button id="btn-refresh">刷新快照</button>
  <span style="color:var(--dim);font-size:11px" id="last-rf">—</span>
</div>

<div class="main">
  <!-- 输入 -->
  <div class="col">
    <h3>输入</h3>

    <div class="card">
      <h4>笔记本</h4>
      <div class="stream" id="suspended-in"></div>
    </div>

    <div class="card">
      <h4>视觉输入</h4>
      <div class="stream" id="vision-in"></div>
    </div>

    <div class="card">
      <h4>弹幕输入</h4>
      <div class="stream" id="dm-in"></div>
    </div>

    <div class="card">
      <h4>对话输入</h4>
      <div class="stream" id="chat-in"></div>
    </div>

    <div class="card">
      <h4>工具返回</h4>
      <div class="stream" id="tool-in"></div>
    </div>

    <div class="card">
      <h4>情绪指引</h4>
      <div class="stream" id="emo-in"></div>
    </div>
  </div>

  <!-- 输出 -->
  <div class="col">
    <h3>输出</h3>

    <div class="card">
      <h4>你最近说过</h4>
      <div class="info" id="ai-info"><span>发言: 0</span></div>
      <div class="stream" id="ai-out"></div>
    </div>
  </div>
</div>

<!-- 流水线排序 -->
<div class="pipeline-panel" style="position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;">
  <h3 style="font-size:12px;color:var(--blue);margin-bottom:6px;letter-spacing:.5px;">输入总线排序 <span style="font-size:11px;color:var(--dim);font-weight:normal">（拖动调整顺序）</span></h3>
  <div class="pipeline-list" id="pipeline-list" style="display:flex;gap:8px;flex-wrap:wrap;">
  </div>
</div>

<script>
const API = 'http://localhost:8091';
var lastTimelineLen = 0, autoInterval = null, speakCount = 0;

// ── WebSocket ──
const ws = new WebSocket('ws://localhost:19767');
ws.onopen  = ()=> Z('ws-dot').className='ws-dot online', Z('ws-status').textContent='在线';
ws.onclose = ()=> Z('ws-dot').className='ws-dot offline', Z('ws-status').textContent='离线';
ws.onmessage = (e) => {
  var m = JSON.parse(e.data);
  if (m.type === 'speak' && m.text) {
    speakCount++;
    push('ai-out', 'a', 'AI', m.text.substring(0,150));
    Z('ai-info').innerHTML = '<span>发言: '+speakCount+'</span>';
  }
};

// ── 刷新 ──
function refresh() {
  fetch(`${API}/debug_prompt`).then(r => r.json()).then(d => {
    var tl = d.timeline || '';
    if (tl.length === lastTimelineLen) return;
    lastTimelineLen = tl.length;

    // 新格式按 section 头解析
    var inits = { suspended:[], vision:[], dm:[], chat:[], tool:[], ai:[], emotion:[] };

    var current = null;
    var pending = null;  // 正在积累的多行事件 {time, text}
    var suspended_items = [];
    var lines = tl.split('\n');
    for (var i=0; i<lines.length; i++) {
      var l = lines[i];
      if (!l.trim()) continue;
      // 匹配 section 头: "视觉输入 (8条):" 等已知类型
      var mh = l.trim().match(/^(笔记本|视觉输入|弹幕输入|对话输入|你最近说过|工具返回|情绪指引)\s*\(\d+条\):/);
      if (mh) {
        // 切换 section 前 flush pending
        if (pending && current) { inits[current].push(pending); pending = null; }
        var secMap = {'笔记本':'suspended','视觉输入':'vision','弹幕输入':'dm','对话输入':'chat','工具返回':'tool','你最近说过':'ai','情绪指引':'emotion'};
        current = secMap[mh[1]] || null;
        continue;
      }
      if (current === null) continue;
      // 情绪指引: 没有时间戳的单行文本
      if (current === 'emotion') {
        if (pending) { inits[current].push(pending); pending = null; }
        var txt = l.trim();
        if (txt && txt !== '(暂无)') inits[current].push({time:'指引', text:txt});
        continue;
      }
      // 匹配事件行: "  [3s前] content..."
      var m = l.match(/^\s+\[(.*?)\]\s+(.*)$/);
      if (m && m[1] !== '输入总线') {
        // 新事件 → 先存入 pending，再开始新的
        if (pending) inits[current].push(pending);
        pending = {time:m[1], text:m[2]};
      } else if (pending) {
        // 续行 → 追加到当前事件文本
        pending.text += ' ' + l.trim();
      }
    }
    if (pending) inits[current].push(pending);

    render('vision-in', inits.vision.slice(-8), 'v', '视觉');
    render('suspended-in', inits.suspended.slice(-20), 'a', '状态');
    render('dm-in',     inits.dm.slice(-8),     'd', '弹幕');
    render('chat-in',   inits.chat.slice(-8),   'c', '对话');
    render('tool-in',   inits.tool.slice(-8),   't', '工具', true);
    render('emo-in',    inits.emotion.slice(-8),'a', '指引');
    render('ai-out',    inits.ai.slice(-8),     'a', '说过');
    Z('ai-info').innerHTML = '<span>发言: '+speakCount+' | 历史: '+inits.ai.length+'</span>';
    Z('last-rf').textContent = ts();

    // 情绪指引: 若 timeline 解析无数据，回退读 /context API
    if (!inits.emotion.length) {
      fetch(`${API}/context`).then(r => r.json()).then(function(d) {
        var g = d.emotion_guidance || '';
        Z('emo-in').innerHTML = g ? '<div class="ev"><span class="tag a">指引</span><span class="body">'+esc(g)+'</span></div>' : '<div class="ev"><span class="body">(暂无)</span></div>';
      }).catch(function(){});
    }
  }).catch(()=> Z('last-rf').textContent='失败');
}

function render(cid, entries, cls, label, isTool) {
  var h = '';
  for (var j=0; j<entries.length; j++) {
    var e = entries[j];
    var c = cls, l = label;
    if (isTool && /失败|错误|异常|error/i.test(e.text)) { c = 'e'; l = '⚠'; }
    h += '<div class="ev"><span class="ts">'+esc(e.time)+'</span><span class="tag '+c+'">'+l+'</span><span class="body">'+esc(e.text)+'</span></div>';
  }
  Z(cid).innerHTML = h;
}

function push(cid, cls, label, text) {
  var c = Z(cid);
  var d = document.createElement('div');
  d.className = 'ev';
  d.innerHTML = '<span class="ts">'+ts()+'</span><span class="tag '+cls+'">'+label+'</span><span class="body">'+esc(text)+'</span>';
  c.prepend(d);
  if (c.children.length > 10) c.lastChild.remove();
}

function toggleAuto() {
  var b = Z('btn-auto');
  if (autoInterval) { clearInterval(autoInterval); autoInterval=null; b.textContent='自动: 关'; b.style.background=''; }
  else { refresh(); autoInterval=setInterval(refresh,3000); b.textContent='自动: 开'; b.style.background='#1a3a2a'; }
}

// ── 流水线排序 ──
var pipeOrder = [];

function loadPipeline() {
  fetch(API + '/pipeline/order').then(r=>r.json()).then(d=>{
    pipeOrder = d.order || [];
    renderPipeline();
  });
}

function renderPipeline() {
  var c = Z('pipeline-list');
  var icon = {'视觉输入':'👁','弹幕输入':'💬','对话输入':'✏','AI 发言':'🤖','工具返回':'🔧','字幕':'📝','情绪指引':'🎭'};
  c.innerHTML = '';
  pipeOrder.forEach(function(section, i){
    var div = document.createElement('div');
    div.className = 'pipe-item';
    div.draggable = true;
    div.dataset.index = i;
    div.innerHTML = '<span class="pipe-handle">⠿</span><span class="pipe-idx">'+(i+1)+'</span><span>'+(icon[section]||'')+'</span><span class="pipe-label">'+section+'</span>';
    div.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', i); this.classList.add('dragging'); });
    div.addEventListener('dragend', function(){ this.classList.remove('dragging'); document.querySelectorAll('.pipe-item').forEach(function(el){el.classList.remove('drag-over');}); });
    div.addEventListener('dragover', function(e){ e.preventDefault(); this.classList.add('drag-over'); });
    div.addEventListener('dragleave', function(){ this.classList.remove('drag-over'); });
    div.addEventListener('drop', function(e){
      e.preventDefault(); this.classList.remove('drag-over');
      var from = parseInt(e.dataTransfer.getData('text/plain'));
      var to = i;
      if (from === to) return;
      var item = pipeOrder.splice(from, 1)[0];
      pipeOrder.splice(to, 0, item);
      renderPipeline();
      savePipeline();
    });
    c.appendChild(div);
  });
}

function savePipeline() {
  fetch(API + '/pipeline/order', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({order:pipeOrder})});
}

loadPipeline();

function Z(id){ return document.getElementById(id); }
function ts(){ var d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0'); }
function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

refresh();
document.getElementById('btn-auto').addEventListener('click', toggleAuto);
document.getElementById('btn-refresh').addEventListener('click', refresh);
</script>
</body>
</html>
